<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <div class="login-container">
            <h1 class="login-h1">Register</h1>
            <form class="login-form">
                <i class="fa-solid fa-user form-icon"></i>
                <input type="text" name="uname" placeholder="Username" class="form-input" autocomplete="off" required>
                <i class="fa-solid fa-lock form-icon"></i>
                <input type="password" name="psw" placeholder="Password" class="form-input" autocomplete="off" required>
                <i class="fa-solid fa-lock form-icon"></i>
                <input type="text" name="psw" placeholder="Repeat password" class="form-input" class="repeatpsw-input" autocomplete="off" required>
                <div class="remember-container">
                    <input type="checkbox" class="remember-input" name="remember-me">
                    <label for="remember-me">Remember Me</label>
                </div>
                <button class="login-button" type="submit" class="form-btn" class="login-button">Register</button>
            </form>
            <span class="register-span">Don't have an account? <strong><a href="login.html">Login</a></strong></span>
        </div>
    </div>
    
    <script src="https://kit.fontawesome.com/3ac14f7443.js" crossorigin="anonymous"></script>
</body>
</html>
